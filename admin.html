<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEPHANTLUX · Admin Panel</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#D4AF37;--primary-light:#F0D060;--primary-dark:#B8960B;--sidebar-bg:#1E1E2E;--sidebar-hover:#2A2A3E;--content-bg:#F0F0F5;--card-bg:#FFF;--text-1:#1A1A1A;--text-2:#555;--text-3:#999;--border:#E5E5E5;--danger:#E53935;--success:#43A047;--info:#1E88E5;--radius:10px}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text-1);background:var(--content-bg);display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sidebar-bg);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:24px 20px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo span{font-size:22px}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;color:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.2s;font-size:14px;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:var(--sidebar-hover)}
.nav-item.active{color:var(--primary);background:var(--sidebar-hover);border-left-color:var(--primary)}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);font-size:12px;color:rgba(255,255,255,0.4)}
.main{flex:1;margin-left:220px;padding:24px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar h1{font-size:22px;font-weight:700}
.btn{padding:8px 18px;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#1A1A1A}
.btn-primary:hover{background:var(--primary-dark);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text-2)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,0.06);overflow:hidden;margin-bottom:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h2{font-size:16px;font-weight:600}
.card-body{padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.06);display:flex;align-items:center;gap:16px}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-info h3{font-size:28px;font-weight:700;line-height:1}
.stat-info p{font-size:13px;color:var(--text-3);margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 16px;background:#FAFAFA;color:var(--text-3);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#FAFAFA}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:16px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;padding:28px;position:relative}
.modal h2{font-size:20px;font-weight:700;margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#999;border:none}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-2)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;transition:border 0.2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all 0.2s}
.upload-area:hover{border-color:var(--primary);background:rgba(212,175,55,0.03)}
.upload-area img{max-width:100%;max-height:120px;border-radius:8px;margin-top:8px}
.upload-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.upload-preview img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.tag-glb{background:#E3F2FD;color:#1565C0}
.tag-procedural{background:#FFF3E0;color:#E65100}
.search-bar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.search-bar select{padding:8px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
.contact-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.contact-icon{font-size:22px;width:40px;text-align:center}
.contact-input{flex:1}
.contact-input label{font-size:12px;color:var(--text-3);display:block;margin-bottom:2px}
.contact-input input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.empty{text-align:center;padding:40px;color:var(--text-3)}
.toast{position:fixed;top:24px;right:24px;background:var(--success);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:300;animation:slideIn 0.3s ease}
.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.glb-info{background:#E3F2FD;border:1px solid #BBDEFB;border-radius:8px;padding:12px;margin-top:8px;font-size:12px;color:#1565C0;line-height:1.6}
.glb-info strong{color:#0D47A1}
.glb-toggle{display:flex;gap:8px;margin-bottom:10px}
.glb-toggle button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:#fff}
.glb-toggle button.active{background:var(--primary);color:#1A1A1A;border-color:var(--primary)}
.form-label button{margin-left:8px;padding:3px 10px;font-size:11px}
#specs-editor>div,#features-editor>div{animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

];

let products = JSON.parse(JSON.stringify(defaultProducts));
let categories = JSON.parse(JSON.stringify(defaultCategories));
let contactInfo = {};

function loadData() {
  try {
    const stored = localStorage.getItem(DATA_KEY);
    if (stored) {
      const data = JSON.parse(stored);
      if (data.version !== DATA_VERSION) {
        localStorage.removeItem(DATA_KEY);
        return;
      }
      if (data.products) products = data.products;
      if (data.categories) categories = data.categories;
    }
  } catch(e) {}
  try { const ci = localStorage.getItem(CONTACT_KEY); if (ci) contactInfo = JSON.parse(ci); } catch(e) {}
}

function saveData() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify({ products, categories, version: DATA_VERSION }));
    return true;
  } catch(e) {
    console.error('Save failed:', e);
    showToast('保存失败：存储空间不足，请减少图片数量或使用较小图片', true);
    return false;
  }
}

function saveContactInfo() {
  localStorage.setItem(CONTACT_KEY, JSON.stringify(contactInfo));
}

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

function fileToBase64(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 800, maxH = 800;
        let w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          const ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const quality = file.size > 1024 * 1024 ? 0.6 : 0.8;
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

function renderProducts() {

  if (filterCat !== 'all') list = list.filter(p => p.category === filterCat);
  const catOptions = categories.map(c => `<option value="${c.id}" ${c.id === filterCat ? 'selected' : ''}>${c.name}</option>`).join('');

      <input class="form-input" style="flex:1" placeholder="参数值" value="${s.value||''}" oninput="updateSpec(${i},'value',this.value)">
      <button type="button" class="btn btn-sm btn-danger" onclick="removeSpec(${i})" style="flex-shrink:0">删除</button>
    </div>`
  ).join('');
}
function addSpec() {
  window._currentSpecs.push({label:'',value:''});
  renderSpecsEditor();
}
function updateSpec(index, field, value) {
  if (window._currentSpecs[index]) window._currentSpecs[index][field] = value;

function removeSpec(index) {
  window._currentSpecs.splice(index, 1);
  renderSpecsEditor();
}

function switchModelType(type) {
  document.getElementById('procedural-section').style.display = type === 'procedural' ? 'block' : 'none';
  document.getElementById('glb-section').style.display = type === 'glb' ? 'block' : 'none';
  document.getElementById('glb-btn-upload').classList.toggle('active', type === 'procedural');
  document.getElementById('glb-btn-url').classList.toggle('active', type === 'glb');
}
function switchGlbMode(mode) {
  document.getElementById('glb-file-area').style.display = mode === 'file' ? 'block' : 'none';
  document.getElementById('glb-url-area').style.display = mode === 'url' ? 'block' : 'none';
  document.getElementById('glb-mode-file').classList.toggle('active', mode === 'file');
  document.getElementById('glb-mode-url').classList.toggle('active', mode === 'url');
}

async function handleGlbUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) {
    showToast('文件超过3MB，请使用URL方式或压缩文件', true);
    return;
  }
  const base64 = await fileToBase64(file);
  window._currentGlbData = base64;
  document.getElementById('glb-file-info').style.display = 'block';
  document.getElementById('glb-file-name').textContent = '文件名: ' + file.name;
  document.getElementById('glb-file-size').textContent = '大小: ' + (file.size / 1024).toFixed(1) + ' KB';
  showToast('GLB文件已加载');
}

async function handleCoverUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const base64 = await fileToBase64(file);
  const area = input.parentElement;
  area.innerHTML = `<img src="${base64}"><input type="file" id="cover-input" accept="image/*" style="display:none" onchange="handleCoverUpload(this)">`;
  window._currentCover = base64;
}

async function handleGalleryUpload(input) {
  const files = Array.from(input.files);
  for (const file of files) {
    const base64 = await fileToBase64(file);
    window._currentGallery.push(base64);
  }
  updateGalleryPreview();
}
function updateGalleryPreview() {
  document.getElementById('gallery-preview').innerHTML = window._currentGallery.map((src, i) =>
    `<div style="position:relative"><img src="${src}"><button onclick="removeGalleryImage(${i});return false" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button></div>`
  ).join('');
}
function removeGalleryImage(index) {
  window._currentGallery.splice(index, 1);
  updateGalleryPreview();
}

function saveProduct(id) {
  try {
  const name = document.getElementById('p-name').value.trim();
  if (!name) { showToast('请输入商品名称', true); return; }
  const category = document.getElementById('p-category').value;
  const gradient = document.getElementById('p-gradient').value.trim() || 'linear-gradient(135deg,#F5F5F5,#E0E0E0)';
  const description = document.getElementById('p-desc').value.trim();
  const detailDescription = document.getElementById('p-detail').value.trim();
  const glbSectionVisible = document.getElementById('glb-section').style.display !== 'none';
  let modelType;
  if (glbSectionVisible) {
    const glbUrlVisible = document.getElementById('glb-url-area').style.display !== 'none';
    if (glbUrlVisible) {
      const url = document.getElementById('p-glb-url').value.trim();
      modelType = url ? 'glb:' + url : 'chandelier';
    } else {
      modelType = window._currentGlbData ? 'glb:' + window._currentGlbData : 'chandelier';
    }
  } else {
    modelType = document.getElementById('p-modelType').value;
  }
  const coverImage = window._currentCover || '';
  const galleryImages = window._currentGallery || [];
  const specs = (window._currentSpecs || []).filter(s => s.label.trim() || s.value.trim());
  const features = (window._currentFeatures || []).filter(f => f.title.trim());
  const existing = id ? products.find(x => x.id === id) : null;
  if (existing) {
    existing.name = name; existing.category = category; existing.gradient = gradient;
    existing.description = description; existing.modelType = modelType;
    existing.coverImage = coverImage || existing.coverImage;
    existing.detailDescription = detailDescription;
    existing.galleryImages = galleryImages.length ? galleryImages : existing.galleryImages;
    existing.specs = specs; existing.features = features;
  } else {
    products.push({ id: 'p' + Date.now(), name, category, modelType, gradient, description, specs, features, detailDescription, galleryImages, coverImage });
  }
  const saved = saveData();
  if (!saved) return;
  document.querySelector('.modal-overlay')?.remove();
  showToast('保存成功！前台小程序将同步更新');
  renderProducts();
  } catch(e) {
    console.error('saveProduct error:', e);
    showToast('保存出错：' + (e.message || '未知错误'), true);
  }
}

function deleteProduct(id) {
  if (!confirm('确认删除此商品？')) return;
  products = products.filter(p => p.id !== id);
  saveData();
  showToast('已删除');
  renderProducts();
}

    <h2>${id ? '编辑分类' : '添加分类'}</h2>
    <div class="form-group"><label class="form-label">分类名称 *</label><input class="form-input" id="cat-name" value="${c.name || ''}" placeholder="如：Wall Lamp"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="saveCategory('${id || ''}')">保存</button>
    </div>
  </div>`;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}
function saveCategory(id) {
  const name = document.getElementById('cat-name').value.trim();
  if (!name) { showToast('请输入分类名称', true); return; }
  const catId = id || 'cat-' + Date.now();
  if (id) {
    const c = categories.find(x => x.id === id);
    if (c) c.name = name;
  } else {
    categories.push({ id: catId, name });
  }
  saveData();
  document.querySelector('.modal-overlay')?.remove();
  showToast('保存成功');
  renderCategories();
}
function deleteCategory(id) {
  if (products.filter(p => p.category === id).length > 0) { showToast('该分类下有商品，无法删除', true); return; }
  if (!confirm('确认删除此分类？')) return;
  categories = categories.filter(c => c.id !== id);
  saveData();
  showToast('已删除');
  renderCategories();
}

function renderContact() {
  document.getElementById('page-content').innerHTML = `
    <div class="topbar"><h1>联系方式管理</h1></div>
    <div class="card"><div class="card-body">
      <div class="contact-item"><div class="contact-icon">📞</div><div class="contact-input"><label>客服电话</label><input id="ci-phone" value="${contactInfo.phone || ''}" placeholder="400-xxx-xxxx"></div></div>
      <div class="contact-item"><div class="contact-icon">💬</div><div class="contact-input"><label>微信号</label><input id="ci-wechat" value="${contactInfo.wechat || ''}" placeholder="elephantlux_kefu"></div></div>
      <div class="contact-item"><div class="contact-icon">🐧</div><div class="contact-input"><label>QQ号</label><input id="ci-qq" value="${contactInfo.qq || ''}" placeholder="123456789"></div></div>
      <div class="contact-item"><div class="contact-icon">📧</div><div class="contact-input"><label>邮箱</label><input id="ci-email" value="${contactInfo.email || ''}" placeholder="service@elephantlux.com"></div></div>
      <div class="contact-item"><div class="contact-icon">📍</div><div class="contact-input"><label>公司地址</label><input id="ci-address" value="${contactInfo.address || ''}" placeholder="Guangzhou, China"></div></div>
      <div class="contact-item"><div class="contact-icon">📘</div><div class="contact-input"><label>Facebook 主页链接</label><input id="ci-facebook" value="${contactInfo.facebook || ''}" placeholder="https://facebook.com/elephantlux"></div></div>
      <div class="contact-item"><div class="contact-icon">📷</div><div class="contact-input"><label>Instagram 主页链接</label><input id="ci-instagram" value="${contactInfo.instagram || ''}" placeholder="https://instagram.com/elephantlux"></div></div>
      <div class="contact-item"><div class="contact-icon">📱</div><div class="contact-input"><label>客服微信二维码</label>
        <div class="upload-area" onclick="document.getElementById('qrcode-input').click()" style="margin-top:6px">
          ${contactInfo.qrcode ? `<img src="${contactInfo.qrcode}">` : '<div>点击上传二维码图片</div>'}
          <input type="file" id="qrcode-input" accept="image/*" style="display:none" onchange="handleQrcodeUpload(this)">
        </div>
      </div></div>
      <button class="btn btn-primary" onclick="saveContact()" style="margin-top:16px">💾 保存设置</button>
    </div></div>
  `;
}
async function handleQrcodeUpload(input) {
  const file = input.files[0]; if (!file) return;
  const base64 = await fileToBase64(file);
  contactInfo.qrcode = base64;
  input.parentElement.innerHTML = `<img src="${base64}"><input type="file" id="qrcode-input" accept="image/*" style="display:none" onchange="handleQrcodeUpload(this)">`;
}
function saveContact() {
  contactInfo.phone = document.getElementById('ci-phone').value.trim();
  contactInfo.wechat = document.getElementById('ci-wechat').value.trim();
  contactInfo.qq = document.getElementById('ci-qq').value.trim();
  contactInfo.email = document.getElementById('ci-email').value.trim();
  contactInfo.address = document.getElementById('ci-address').value.trim();
  contactInfo.facebook = document.getElementById('ci-facebook').value.trim();
  contactInfo.instagram = document.getElementById('ci-instagram').value.trim();
  saveContactInfo();
  showToast('联系方式已保存！前台小程序将同步更新');
}

function renderData() {
  document.getElementById('page-content').innerHTML = `
    <div class="topbar"><h1>数据管理</h1></div>
    <div class="card"><div class="card-header"><h2>数据导出 / 导入</h2></div><div class="card-body">
      <p style="color:var(--text-2);margin-bottom:16px">定期导出数据备份，防止浏览器清除缓存导致数据丢失。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-success" onclick="exportData()">📥 导出数据 (JSON)</button>
        <button class="btn btn-info" onclick="document.getElementById('import-file').click()">📤 导入数据<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)"></button>
        <button class="btn btn-danger" onclick="resetData()">🔄 恢复默认数据</button>
      </div>
    </div></div>
    <div class="card"><div class="card-header"><h2>数据统计</h2></div><div class="card-body">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon" style="background:rgba(212,175,55,0.1);color:#D4AF37">📦</div><div class="stat-info"><h3>${JSON.stringify(products).length}</h3><p>数据大小 (bytes)</p></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:rgba(33,150,243,0.1);color:#2196F3">🖼️</div><div class="stat-info"><h3>${products.reduce((s,p)=>s+(p.galleryImages?.length||0),0)}</h3><p>图片总数</p></div></div>
      </div>
    </div></div>
  `;
}
function exportData() {
  const data = { products, categories, contactInfo, exportDate: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'elephantlux-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  showToast('数据已导出');
}
function importData(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.products) products = data.products;
      if (data.categories) categories = data.categories;
      if (data.contactInfo) contactInfo = data.contactInfo;
      saveData(); saveContactInfo();
      showToast('数据导入成功');
      renderData();
    } catch(e) { showToast('导入失败：文件格式错误', true); }
  };
  reader.readAsText(file);
}
function resetData() {
  if (!confirm('确认恢复默认数据？所有自定义内容将丢失！')) return;
  products = JSON.parse(JSON.stringify(defaultProducts));
  categories = JSON.parse(JSON.stringify(defaultCategories));
  contactInfo = {};
  saveData(); saveContactInfo();
  showToast('已恢复默认数据');
  renderData();
}

function navTo(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  switch(page) {
    case 'dashboard': renderDashboard(); break;
    case 'products': renderProducts(); break;
    case 'categories': renderCategories(); break;
    case 'contact': renderContact(); break;
    case 'data': renderData(); break;
  }
}

document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => navTo(n.dataset.page)));
loadData();
renderDashboard();
</script>
</body>
</html>
