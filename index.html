<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ELEPHANTLUX · 3D Experience</title>
  <script type="importmap">

    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

    }
  }

  <style>
/* ======================== 基础重置 ======================== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #C9A227; --primary-light: #E8C84E; --primary-dark: #A8861B;
  --primary-grad: linear-gradient(135deg, #C9A227 0%, #E8C84E 100%);
  --bg: #F0F0F4; --bg-soft: #F7F7FA; --card-bg: #FFFFFF;
  --text-1: #1C1C1E; --text-2: #555558; --text-3: #9A9AA0;
  --border: #ECECF0; --border-soft: #F3F3F7;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  --shadow-gold: 0 6px 24px rgba(201,162,39,0.3);
  --glass: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.5);
  --radius: 14px; --radius-lg: 20px; --radius-xl: 24px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: var(--text-1); background: var(--bg); }
#app { width: 100%; max-width: 480px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); }
.view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, transform 0.3s ease; transform: translateX(30px); overflow: hidden; }
.view.active { opacity: 1; visibility: visible; transform: translateX(0); }
#scan-view.active { transform: translateX(0); }

/* 扫码页 */
#scan-view { background: linear-gradient(145deg, #08080F 0%, #14142B 40%, #1B1B3A 70%, #0F0F22 100%); display: flex; align-items: center; justify-content: center; }
.scan-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 25% 15%, rgba(201,162,39,0.10) 0%, transparent 45%), radial-gradient(circle at 75% 85%, rgba(100,80,200,0.08) 0%, transparent 45%), radial-gradient(circle at 50% 50%, rgba(201,162,39,0.04) 0%, transparent 70%); pointer-events: none; }
.scan-bg::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 28px 28px; opacity: 0.5; }
.scan-container { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 40px; }
.scan-logo { margin-bottom: 36px; opacity: 0; animation: fadeInDown 0.8s 0.2s ease forwards; filter: drop-shadow(0 0 12px rgba(201,162,39,0.3)); }
.scan-frame { position: relative; width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; opacity: 0; animation: fadeInUp 0.8s 0.5s ease forwards; }
.scan-corner { position: absolute; width: 26px; height: 26px; border: 2.5px solid var(--primary-light); }
.scan-corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
.scan-corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
.scan-corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
.scan-corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
.scan-line { position: absolute; left: 10px; right: 10px; height: 2px; background: linear-gradient(90deg, transparent, var(--primary-light), transparent); box-shadow: 0 0 12px var(--primary-light); animation: scanMove 2.5s ease-in-out infinite; }
.scan-qr { opacity: 0.92; filter: drop-shadow(0 0 8px rgba(201,162,39,0.15)); }
.scan-title { font-size: 24px; font-weight: 700; color: #FFFFFF; letter-spacing: 3px; margin-bottom: 8px; opacity: 0; animation: fadeInUp 0.8s 0.7s ease forwards; }
.scan-subtitle { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 3px; margin-bottom: 40px; opacity: 0; animation: fadeInUp 0.8s 0.9s ease forwards; }
.scan-enter-btn { padding: 15px 60px; border: none; border-radius: 30px; background: linear-gradient(135deg, #C9A227, #E8C84E); color: #1A1A1A; font-size: 16px; font-weight: 600; letter-spacing: 3px; cursor: pointer; box-shadow: 0 8px 32px rgba(201,162,39,0.35), inset 0 1px 0 rgba(255,255,255,0.3); transition: transform 0.2s, box-shadow 0.2s; opacity: 0; animation: fadeInUp 0.8s 1.1s ease forwards; position: relative; overflow: hidden; }
.scan-enter-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 3s infinite; }
@keyframes shimmer { 0% { left: -100%; } 50%, 100% { left: 200%; } }
.scan-enter-btn:active { transform: scale(0.96); box-shadow: 0 4px 16px rgba(201,162,39,0.25); }
.scan-tip { margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.3); opacity: 0; animation: fadeInUp 0.8s 1.3s ease forwards; }
@keyframes scanMove { 0% { top: 8px; } 50% { top: 140px; } 100% { top: 8px; } }
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* 商品列表 */
#list-view { display: flex; flex-direction: column; }
.app-header { flex-shrink: 0; position: sticky; top: 0; z-index: 10; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: var(--shadow-xs); border-bottom: 1px solid var(--border-soft); }
.header-bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
.header-brand { display: flex; align-items: center; gap: 6px; font-size: 19px; font-weight: 800; white-space: nowrap; letter-spacing: -0.5px; }
.brand-icon { font-size: 22px; }
.brand-logo { height: 30px; width: auto; object-fit: contain; }
.header-search { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 20px; padding: 8px 14px; color: var(--text-3); border: 1px solid var(--border-soft); transition: border-color 0.2s; }
.header-search:focus-within { border-color: var(--primary-light); }
.header-search input { border: none; background: none; outline: none; font-size: 13px; color: var(--text-1); width: 100%; }
.header-search input::placeholder { color: var(--text-3); }
.category-nav { display: flex; gap: 6px; padding: 6px 12px 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.category-nav::-webkit-scrollbar { display: none; }
.category-item { flex-shrink: 0; padding: 7px 18px; border-radius: 18px; font-size: 13px; font-weight: 500; color: var(--text-2); background: transparent; cursor: pointer; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); }
.category-item.active { background: var(--primary-grad); color: #fff; font-weight: 600; box-shadow: var(--shadow-gold); }
.product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; padding-bottom: 30px; }
.product-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s; display: flex; flex-direction: column; }
.product-card:active { transform: scale(0.97); box-shadow: var(--shadow-md); }
.product-image { width: 100%; padding-bottom: 100%; position: relative; overflow: hidden; flex-shrink: 0; }
.product-image::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.15) 0%, transparent 60%); pointer-events: none; }
.product-image svg { width: 58%; height: 58%; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.18)); transition: transform 0.3s; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }
.product-card:active .product-image svg { transform: translate(-50%, -50%) scale(1.08); }
.product-image::after { content: '3D'; position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; z-index: 2; }
.product-info { padding: 10px 12px 12px; flex-shrink: 0; background: var(--card-bg); }
.product-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-1); }
.product-category { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.grid-bottom-tip { text-align: center; padding: 16px 0 24px; font-size: 12px; color: var(--text-3); flex-shrink: 0; }

/* 详情页 */
#detail-view { background: var(--bg); }
.detail-header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: var(--shadow-xs); border-bottom: 1px solid var(--border-soft); }
.back-btn { background: none; border: none; padding: 4px; cursor: pointer; color: var(--text-1); display: flex; align-items: center; }
.detail-header-title { font-size: 16px; font-weight: 700; }
.detail-header-right { width: 24px; }
.detail-scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 52px; padding-bottom: 80px; }
.detail-image { width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; position: relative; }
.detail-image::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0.2) 0%, transparent 65%); pointer-events: none; }
.detail-image svg { width: 55%; height: 65%; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.22)); position: relative; z-index: 1; }
.detail-3d-badge { position: absolute; bottom: 14px; right: 14px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); color: #fff; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 16px; display: flex; align-items: center; gap: 5px; cursor: pointer; transition: background 0.2s, transform 0.2s; z-index: 2; }
.detail-3d-badge:active { transform: scale(0.92); background: rgba(201,162,39,0.7); }
.detail-info { background: var(--card-bg); margin: 12px 14px; border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); }
.detail-name { font-size: 21px; font-weight: 800; line-height: 1.4; letter-spacing: -0.3px; }
.detail-tag { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 10px; font-size: 11px; font-weight: 500; background: rgba(201,162,39,0.1); color: var(--primary-dark); }
.detail-desc { margin-top: 14px; font-size: 14px; line-height: 1.75; color: var(--text-2); }
.detail-section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.detail-section-title::before { content: ''; width: 4px; height: 15px; background: var(--primary-grad); border-radius: 2px; }
.detail-specs, .detail-features { background: var(--card-bg); margin: 10px 14px; border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); }
.spec-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
.spec-row:last-child { border-bottom: none; }
.spec-label { color: var(--text-3); }
.spec-value { font-weight: 600; }
.feature-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; }
.feature-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; background: rgba(201,162,39,0.08); display: flex; align-items: center; justify-content: center; color: var(--primary); }
.feature-text h4 { font-size: 13px; font-weight: 700; }
.feature-text p { font-size: 12px; color: var(--text-3); margin-top: 3px; line-height: 1.6; }
.detail-footer { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; padding: 12px 16px calc(14px + var(--safe-bottom)); background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 -2px 16px rgba(0,0,0,0.04); border-top: 1px solid var(--border-soft); }
.view-3d-btn { width: 100%; padding: 15px; border: none; border-radius: var(--radius); background: var(--primary-grad); color: #1A1A1A; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-gold); transition: transform 0.2s, box-shadow 0.2s; }
.view-3d-btn:active { transform: scale(0.98); box-shadow: 0 4px 12px rgba(201,162,39,0.2); }

/* 商品详情介绍 */
.detail-description { background: var(--card-bg); margin: 10px 14px; border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); }
.detail-desc-content { font-size: 14px; line-height: 1.85; color: var(--text-2); }
.detail-desc-content p { margin-bottom: 12px; }
.detail-desc-content p:last-child { margin-bottom: 0; }
.detail-desc-content img { width: 100%; border-radius: var(--radius); margin: 12px 0; }
.detail-desc-content strong { color: var(--text-1); font-weight: 700; }

/* 相关图片 */
.detail-gallery { background: var(--card-bg); margin: 10px 14px; border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); }
.gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.gallery-item { width: 100%; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; cursor: pointer; background: var(--bg); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
.gallery-item:active img { transform: scale(1.08); }

/* 图片大图查看器 */
.gallery-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
.gallery-viewer.active { opacity: 1; visibility: visible; }
.gallery-viewer img { max-width: 95%; max-height: 85%; border-radius: 8px; }
.gallery-viewer-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.gallery-viewer-counter { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.6); font-size: 13px; }
.gallery-viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.gallery-viewer-nav.prev { left: 12px; }
.gallery-viewer-nav.next { right: 12px; }

/* 3D查看器 */
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: linear-gradient(180deg, #F8F8FC 0%, #E8E8EE 100%); opacity: 0; visibility: hidden; transition: opacity 0.3s ease; display: flex; flex-direction: column; }
.overlay.active { opacity: 1; visibility: visible; }
.viewer-header { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + var(--safe-bottom)); background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: var(--shadow-xs); border-bottom: 1px solid var(--border-soft); z-index: 5; }
.viewer-close, .viewer-rotate-btn { background: none; border: none; padding: 8px; cursor: pointer; color: var(--text-1); display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; border-radius: 10px; transition: background 0.2s; }
.viewer-close:active, .viewer-rotate-btn:active { background: var(--bg); }
.viewer-rotate-btn.active { color: var(--primary); background: rgba(201,162,39,0.1); }
.viewer-rotate-btn.active span { color: var(--primary); }
.viewer-title { font-size: 15px; font-weight: 700; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-canvas-wrap { flex: 1; position: relative; overflow: hidden; }
.viewer-canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
.viewer-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 3; }
.viewer-loading p { margin-top: 16px; font-size: 13px; color: var(--text-3); }
.loading-ring { width: 44px; height: 44px; margin: 0 auto; border: 3px solid rgba(201,162,39,0.15); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.viewer-footer { padding: 14px 16px calc(14px + var(--safe-bottom)); background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); z-index: 5; border-top: 1px solid var(--border-soft); }
.viewer-hint { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.viewer-hint svg { flex-shrink: 0; opacity: 0.6; }
.viewer-360 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: linear-gradient(180deg, #F8F8FC 0%, #E8E8EE 100%); }
.viewer-360 img { max-width: 88%; max-height: 88%; object-fit: contain; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); user-select: none; -webkit-user-drag: none; pointer-events: none; }
.viewer-360-hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); background: var(--glass); padding: 7px 16px; border-radius: 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: opacity 0.4s ease; border: 1px solid var(--border-soft); box-shadow: var(--shadow-xs); }
.viewer-360-progress { position: absolute; top: 0; left: 0; height: 3px; background: var(--primary-grad); transition: width 0.1s; border-radius: 0 2px 2px 0; }
.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-3); }
.empty-state p { font-size: 14px; margin-top: 12px; }
@media (min-width: 481px) { body { background: linear-gradient(135deg, #D8D8E0 0%, #C8C8D2 100%); } #app { box-shadow: 0 0 60px rgba(0,0,0,0.15); } }
  </style>

<body>
  <div id="app">
    <div id="scan-view" class="view active">
      <div class="scan-bg"></div>
      <div class="scan-container">
        <div class="scan-logo">
          <img src="logo.png" alt="ELEPHANTLUX" style="height:48px;width:auto;filter:brightness(0) invert(1);">
        </div>
        <div class="scan-frame">
          <div class="scan-corner tl"></div><div class="scan-corner tr"></div>

              <rect x="65" y="10" width="25" height="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/><rect x="70" y="15" width="15" height="15" fill="rgba(255,255,255,0.2)"/>
              <rect x="10" y="65" width="25" height="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/><rect x="15" y="70" width="15" height="15" fill="rgba(255,255,255,0.2)"/>
              <rect x="45" y="10" width="8" height="8" fill="rgba(255,255,255,0.15)"/><rect x="58" y="10" width="5" height="5" fill="rgba(255,255,255,0.15)"/>
              <rect x="45" y="22" width="5" height="8" fill="rgba(255,255,255,0.15)"/><rect x="55" y="25" width="10" height="5" fill="rgba(255,255,255,0.15)"/>
              <rect x="45" y="40" width="5" height="5" fill="rgba(255,255,255,0.15)"/><rect x="55" y="40" width="8" height="8" fill="rgba(255,255,255,0.15)"/>
              <rect x="68" y="42" width="5" height="5" fill="rgba(255,255,255,0.15)"/><rect x="80" y="40" width="8" height="5" fill="rgba(255,255,255,0.15)"/>
              <rect x="42" y="52" width="8" height="8" fill="rgba(255,255,255,0.15)"/><rect x="55" y="55" width="5" height="5" fill="rgba(255,255,255,0.15)"/>

              <rect x="42" y="65" width="5" height="5" fill="rgba(255,255,255,0.15)"/><rect x="52" y="68" width="8" height="8" fill="rgba(255,255,255,0.15)"/>

function cylinderBetween(p1, p2, rTop, rBottom, material) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(rTop, rBottom, len, 12);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
  const up = new THREE.Vector3(0, 1, 0);
  mesh.quaternion.setFromUnitVectors(up, dir.clone().normalize());
  return mesh;
}
function setShadows(group) { group.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); }
function centerModel(group) { const box = new THREE.Box3().setFromObject(group); const center = box.getCenter(new THREE.Vector3()); group.position.sub(center); return group; }

function createMaterials() {
  return {
    gold: new THREE.MeshStandardMaterial({ color: 0xD4AF37, metalness: 0.9, roughness: 0.22 }),
    brass: new THREE.MeshStandardMaterial({ color: 0xC9A227, metalness: 0.85, roughness: 0.28 }),

    darkMetal: new THREE.MeshStandardMaterial({ color: 0x2A2A2A, metalness: 0.8, roughness: 0.35 }),

    crystal: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.05, transmission: 0.88, transparent: true, opacity: 0.75, ior: 1.5 }),
    shadeFabric: new THREE.MeshStandardMaterial({ color: 0xF0E6D2, roughness: 0.92, metalness: 0.0, side: THREE.DoubleSide, emissive: 0xFFE5B4, emissiveIntensity: 0.18 }),

  const light = new THREE.PointLight(0xFFD700, 0.7, 3); light.position.set(0, 0.7, 0); group.add(light);
  setShadows(group); return group;
}

class Viewer3D {
  constructor(container, modelType) {
    this.container = container; this.modelType = modelType;
    this.scene = null; this.camera = null; this.renderer = null; this.controls = null;
    this.model = null; this.animationId = null; this.autoRotate = false;
    this._disposed = false; this._onResize = this._onResize.bind(this);
  }
  init() {
    try {
      this.scene = new THREE.Scene();
      const bgCanvas = document.createElement('canvas'); bgCanvas.width = 2; bgCanvas.height = 512;
      const ctx = bgCanvas.getContext('2d'); const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#FAFAFC'); grad.addColorStop(0.5, '#F0F0F4'); grad.addColorStop(1, '#E4E4EA');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 2, 512);
      this.scene.background = new THREE.CanvasTexture(bgCanvas);
      const w = this.container.clientWidth || 400, h = this.container.clientHeight || 600;
      this.camera = new THREE.PerspectiveCamera(42, w/h, 0.1, 100); this.camera.position.set(0, 0.2, 2.8);
      this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      this.renderer.setSize(w, h); this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      this.renderer.shadowMap.enabled = true; this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      this.renderer.toneMapping = THREE.ACESFilmicToneMapping; this.renderer.toneMappingExposure = 1.1;
      this.container.appendChild(this.renderer.domElement);
      this._setupLights(); this._setupGround();
      this.controls = new OrbitControls(this.camera, this.renderer.domElement);
      this.controls.enableDamping = true; this.controls.dampingFactor = 0.06;
      this.controls.minDistance = 1.2; this.controls.maxDistance = 6; this.controls.autoRotateSpeed = 2.5;
      this.controls.enablePan = false;
      this.controls.minPolarAngle = 0;
      this.controls.maxPolarAngle = Math.PI;
      this.controls.minDistance = 0.8;
      this.controls.maxDistance = 8;
      this.controls.rotateSpeed = 0.8;
      this.controls.target.set(0, 0, 0); this.controls.update();
      this._loadModel();
      window.addEventListener('resize', this._onResize);
      this._entryAnimation(); this._animate();
      setTimeout(() => { const l = document.getElementById('viewer-loading'); if (l) { l.style.transition = 'opacity 0.4s'; l.style.opacity = '0'; setTimeout(() => l.style.display = 'none', 400); } }, 600);
    } catch (err) { console.error('Viewer3D init error:', err); throw err; }
  }
  _setupLights() {
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(4, 6, 4); key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024); key.shadow.camera.near = 0.5; key.shadow.camera.far = 20;
    key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 3; key.shadow.camera.bottom = -3; key.shadow.bias = -0.0005;
    this.scene.add(key);
    const fill = new THREE.DirectionalLight(0xE8E8FF, 0.35); fill.position.set(-4, 2, -3); this.scene.add(fill);
    this.scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xE0E0E0, 0.35));
    const pmrem = new THREE.PMREMGenerator(this.renderer);
    this.scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    const warm = new THREE.DirectionalLight(0xFFE5B4, 0.2); warm.position.set(2, -1, 3); this.scene.add(warm);
  }
  _setupGround() { const g = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.12 })); g.rotation.x = -Math.PI/2; g.position.y = -0.7; g.receiveShadow = true; this.scene.add(g); }
  _loadModel() {
    if (this.modelType && this.modelType.startsWith('glb:')) {
      const glbData = this.modelType.substring(4);
      const loader = new GLTFLoader();
      try {
        loader.load(glbData, (gltf) => {
          this.model = gltf.scene;
          const box = new THREE.Box3().setFromObject(this.model);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 1.5 / maxDim;
          this.model.scale.setScalar(scale);
          centerModel(this.model);
          this.scene.add(this.model);
          if (this._disposed) return;
        }, undefined, (error) => {
          console.error('GLB load error:', error);
          this._loadProceduralModel();
        });
        return;
      } catch(e) {
        console.error('GLB error:', e);
      }
    }
    this._loadProceduralModel();
  }
  _loadProceduralModel() {
    this.model = createLampModel(this.modelType); this.scene.add(this.model);
    const box = new THREE.Box3().setFromObject(this.model); const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    if (this.controls) {
      if (maxDim > 1.5) { this.camera.position.set(0, 0.2, 3.6); this.controls.minDistance = 1.8; this.controls.maxDistance = 7; }
      else if (maxDim < 0.8) { this.camera.position.set(0, 0.1, 2.2); this.controls.minDistance = 1.0; this.controls.maxDistance = 5; }
      this.controls.update();
    }
  }
  _entryAnimation() {
    if (!this.model) return; this.model.scale.set(0.01, 0.01, 0.01);
    const dur = 600, start = performance.now();
    const anim = () => { if (this._disposed) return; const t = Math.min((performance.now()-start)/dur, 1); const c1 = 1.70158, c3 = c1+1; const e = 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); const s = e; this.model.scale.set(s,s,s); if (t < 1) requestAnimationFrame(anim); };
    requestAnimationFrame(anim);
  }
  toggleAutoRotate() { if (!this.controls) return false; this.autoRotate = !this.autoRotate; this.controls.autoRotate = this.autoRotate; return this.autoRotate; }
  _onResize() { if (!this.camera || !this.renderer || this._disposed) return; const w = this.container.clientWidth, h = this.container.clientHeight; this.camera.aspect = w/h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w, h); }
  _animate() { if (this._disposed) return; this.animationId = requestAnimationFrame(() => this._animate()); if (this.controls) this.controls.update(); if (this.renderer && this.scene && this.camera) this.renderer.render(this.scene, this.camera); }
  dispose() {
    this._disposed = true; if (this.animationId) { cancelAnimationFrame(this.animationId); this.animationId = null; }
    window.removeEventListener('resize', this._onResize);
    if (this.controls) { this.controls.dispose(); this.controls = null; }
    if (this.model) { this.model.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) { Array.isArray(c.material) ? c.material.forEach(m=>m.dispose()) : c.material.dispose(); } }); this.scene.remove(this.model); this.model = null; }
    if (this.renderer) { this.renderer.dispose(); if (this.renderer.domElement?.parentNode) this.renderer.domElement.parentNode.removeChild(this.renderer.domElement); this.renderer = null; }
    this.scene = null; this.camera = null;
  }
}

/* ======================== 应用逻辑 ======================== */
const state = { currentView: 'scan', currentCategory: 'all', currentProduct: null, viewer: null, searchKeyword: '' };

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId)?.classList.add('active');
  state.currentView = viewId.replace('-view', '');
  if (viewId === 'list-view') document.getElementById('product-grid')?.scrollTo(0, 0);
}

function enterApp() {
  const btn = document.getElementById('enter-btn'); if (btn) { btn.style.transform = 'scale(0.95)'; setTimeout(() => btn.style.transform = '', 200); }
  setTimeout(() => { showView('list-view'); renderCategories(); renderProducts(); }, 200);
}

function renderCategories() {
  const nav = document.getElementById('category-nav'); if (!nav) return;
  nav.innerHTML = categories.map(c => `<div class="category-item ${c.id===state.currentCategory?'active':''}" data-category="${c.id}">${c.name}</div>`).join('');
  nav.querySelectorAll('.category-item').forEach(item => { item.addEventListener('click', () => { state.currentCategory = item.dataset.category; renderCategories(); renderProducts(); }); });
}

function renderProducts() {
  const grid = document.getElementById('product-grid'); if (!grid) return;
  let list = state.currentCategory === 'all' ? [...products] : products.filter(p => p.category === state.currentCategory);
  if (state.searchKeyword) { const kw = state.searchKeyword.toLowerCase(); list = list.filter(p => p.name.toLowerCase().includes(kw) || getCategoryName(p.category).includes(kw)); }
  if (list.length === 0) { grid.innerHTML = `<div class="empty-state"><svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="#CCC" stroke-width="2"><circle cx="28" cy="28" r="18"/><line x1="42" y1="42" x2="54" y2="54" stroke-linecap="round"/></svg><p>No matching lamps found</p></div>`; return; }
  grid.innerHTML = list.map(p => `<div class="product-card" data-id="${p.id}"><div class="product-image" style="background:${p.gradient};position:relative;overflow:hidden">${p.coverImage?'<img src="'+p.coverImage+'" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0">':getLampSVG(p.modelType)}</div><div class="product-info"><div class="product-name">${p.name}</div><div class="product-category">${getCategoryName(p.category)}</div></div></div>`).join('');
  grid.querySelectorAll('.product-card').forEach(card => { card.addEventListener('click', () => { const p = products.find(x => x.id === card.dataset.id); if (p) showProductDetail(p); }); });
}

function showProductDetail(product) {
  state.currentProduct = product;
  const content = document.getElementById('detail-content');
  const descHtml = product.detailDescription ? `<div class="detail-description"><div class="detail-section-title">Product Details</div><div class="detail-desc-content">${formatDetailText(product.detailDescription)}</div></div>` : '';
const galleryHtml = (product.galleryImages && product.galleryImages.length) ? `<div class="detail-gallery"><div class="detail-section-title">Gallery</div><div class="gallery-grid">${product.galleryImages.map((src,i) => `<div class="gallery-item" onclick="openGalleryViewer(${i})"><img src="${src}" alt=""></div>`).join('')}</div></div>` : '';
  content.innerHTML = `
    <div class="detail-image" style="background:${product.gradient}">${getLampSVG(product.modelType)}<div class="detail-3d-badge" id="detail-3d-badge">${product.images360&&product.images360.length?'<svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 12a9 9 0 1 0 9-9\"/><polyline points=\"3 4 3 10 9 10\"/></svg>360° View':'<svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 2 L2 7 L12 12 L22 7 Z\"/><path d=\"M2 17 L12 22 L22 17\"/><path d=\"M2 12 L12 17 L22 12\"/></svg>3D View'}</div></div>
    <div class="detail-info"><h1 class="detail-name">${product.name}</h1><span class="detail-tag">${getCategoryName(product.category)}</span><p class="detail-desc">${product.description}</p></div>
    <div class="detail-specs"><div class="detail-section-title">Specifications</div>${product.specs.map(s => `<div class="spec-row"><span class="spec-label">${s.label}</span><span class="spec-value">${s.value}</span></div>`).join('')}</div>
    <div class="detail-features"><div class="detail-section-title">Features</div>${product.features.map(f => `<div class="feature-item"><div class="feature-icon">${getFeatureIcon(f.icon)}</div><div class="feature-text"><h4>${f.title}</h4><p>${f.desc}</p></div></div>`).join('')}</div>
    ${descHtml}
    ${galleryHtml}`;
  showView('detail-view'); content.scrollTop = 0;
  document.getElementById('detail-3d-badge')?.addEventListener('click', openViewer);
}

function formatDetailText(text) {
  return text.split(/\n\n+/).map(para => `<p>${para.replace(/\n/g, '<br>')}</p>`).join('');
}

// ======================== 图片大图查看器 ========================
let galleryViewerState = { images: [], index: 0 };

function openGalleryViewer(index) {
  if (!state.currentProduct || !state.currentProduct.galleryImages) return;
  galleryViewerState.images = state.currentProduct.galleryImages;
  galleryViewerState.index = index;
  let viewer = document.getElementById('gallery-viewer');
  if (!viewer) {
    viewer = document.createElement('div');
    viewer.id = 'gallery-viewer';
    viewer.className = 'gallery-viewer';
    viewer.innerHTML = `<button class="gallery-viewer-close" onclick="closeGalleryViewer()">&times;</button><button class="gallery-viewer-nav prev" onclick="galleryNav(-1)">&#8249;</button><img id="gallery-viewer-img" src="" onclick="event.stopPropagation()"><button class="gallery-viewer-nav next" onclick="galleryNav(1)">&#8250;</button><span class="gallery-viewer-counter" id="gallery-viewer-counter"></span>`;
    viewer.addEventListener('click', (e) => { if (e.target === viewer) closeGalleryViewer(); });
    document.body.appendChild(viewer);
  }
  updateGalleryViewer();
  viewer.classList.add('active');
}

function updateGalleryViewer() {
  const img = document.getElementById('gallery-viewer-img');
  const counter = document.getElementById('gallery-viewer-counter');
  if (img) img.src = galleryViewerState.images[galleryViewerState.index];
  if (counter) counter.textContent = `${galleryViewerState.index + 1} / ${galleryViewerState.images.length}`;
}

function galleryNav(dir) {
  const n = galleryViewerState.images.length;
  galleryViewerState.index = ((galleryViewerState.index + dir) % n + n) % n;
  updateGalleryViewer();
}

function closeGalleryViewer() {
  const viewer = document.getElementById('gallery-viewer');
  if (viewer) viewer.classList.remove('active');
}

// 暴露到全局作用域，供 onclick 调用
window.openGalleryViewer = openGalleryViewer;
window.galleryNav = galleryNav;
window.closeGalleryViewer = closeGalleryViewer;

// ======================== 360度图片查看器 ========================
class Viewer360 {
  constructor(container, images) {
    this.container = container; this.images = images;
    this.currentFrame = 0; this.isDragging = false;
    this.startX = 0; this.startFrame = 0; this.velocity = 0;
    this.lastDragX = 0; this.lastDragTime = 0;
    this.autoRotate = false; this.autoRotateTimer = null;
    this.autoPreviewTimer = null; this.momentumRAF = null;
    this.el = null; this.imgEl = null; this.progressEl = null;
    this.preloaded = []; this.hintEl = null;
  }
  init() {
    this.container.innerHTML = '';
    // 预加载所有图片
    this.preloaded = this.images.map(src => { const img = new Image(); img.src = src; return img; });
    this.el = document.createElement('div'); this.el.className = 'viewer-360';
    this.imgEl = document.createElement('img'); this.imgEl.src = this.images[0]; this.imgEl.alt = '';
    this.progressEl = document.createElement('div'); this.progressEl.className = 'viewer-360-progress';
    this.progressEl.style.width = (100 / this.images.length) + '%';
    this.hintEl = document.createElement('div'); this.hintEl.className = 'viewer-360-hint';
    this.hintEl.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 4 3 10 9 10"/></svg><span>Drag to rotate</span>';
    this.el.appendChild(this.imgEl); this.el.appendChild(this.progressEl); this.el.appendChild(this.hintEl);
    this.container.appendChild(this.el);
    // 绑定交互
    this._onDown = (e) => this._onPointerDown(e);
    this._onMove = (e) => this._onPointerMove(e);
    this._onUp = () => this._onPointerUp();
    this.el.addEventListener('mousedown', this._onDown);
    this.el.addEventListener('touchstart', this._onDown, { passive: false });
    document.addEventListener('mousemove', this._onMove);
    document.addEventListener('touchmove', this._onMove, { passive: false });
    document.addEventListener('mouseup', this._onUp);
    document.addEventListener('touchend', this._onUp);
    // 隐藏loading
    const loading = document.getElementById('viewer-loading');
    if (loading) { loading.style.display = 'none'; }
    // 自动预览旋转2.5秒
    this._startAutoPreview();
  }
  _startAutoPreview() {
    const total = Math.min(this.images.length, 24);
    const interval = 2200 / total;
    let count = 0;
    this.autoPreviewTimer = setInterval(() => {
      count++;
      this.currentFrame = (this.currentFrame + 1) % this.images.length;
      this._updateImage();
      if (count >= total) { clearInterval(this.autoPreviewTimer); this.autoPreviewTimer = null; }
    }, interval);
  }
  _updateImage() {
    const n = this.images.length;
    const idx = ((Math.round(this.currentFrame) % n) + n) % n;
    if (this.imgEl.dataset.idx != idx) {
      this.imgEl.src = this.images[idx];
      this.imgEl.dataset.idx = idx;
      this.progressEl.style.width = ((idx + 1) * 100 / n) + '%';
    }
  }
  _getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
  _onPointerDown(e) {
    e.preventDefault();
    if (this.autoPreviewTimer) { clearInterval(this.autoPreviewTimer); this.autoPreviewTimer = null; }
    if (this.momentumRAF) { cancelAnimationFrame(this.momentumRAF); this.momentumRAF = null; }
    if (this.autoRotate) this.toggleAutoRotate();
    this.isDragging = true;
    this.startX = this._getX(e); this.startFrame = this.currentFrame;
    this.lastDragX = this.startX; this.lastDragTime = Date.now(); this.velocity = 0;
    if (this.hintEl) this.hintEl.style.opacity = '0';
  }
  _onPointerMove(e) {
    if (!this.isDragging) return;
    e.preventDefault();
    const x = this._getX(e); const dx = x - this.startX;
    const step = Math.max(15, this.container.offsetWidth / this.images.length / 1.2);
    this.currentFrame = this.startFrame + dx / step;
    const now = Date.now(); const dt = now - this.lastDragTime;
    if (dt > 0) this.velocity = (x - this.lastDragX) / dt;
    this.lastDragX = x; this.lastDragTime = now;
    this._updateImage();
  }
  _onPointerUp() {
    if (!this.isDragging) return;
    this.isDragging = false;
    if (Math.abs(this.velocity) > 0.03) this._applyMomentum();
  }
  _applyMomentum() {
    const step = Math.max(15, this.container.offsetWidth / this.images.length / 1.2);
    const animate = () => {
      if (Math.abs(this.velocity) < 0.008) { this.momentumRAF = null; return; }
      this.currentFrame += this.velocity * 16 / step;
      this._updateImage();
      this.velocity *= 0.94;
      this.momentumRAF = requestAnimationFrame(animate);
    };
    this.momentumRAF = requestAnimationFrame(animate);
  }
  toggleAutoRotate() {
    if (this.momentumRAF) { cancelAnimationFrame(this.momentumRAF); this.momentumRAF = null; }
    if (this.autoPreviewTimer) { clearInterval(this.autoPreviewTimer); this.autoPreviewTimer = null; }
    this.autoRotate = !this.autoRotate;
    if (this.autoRotate) {
      this.autoRotateTimer = setInterval(() => {
        this.currentFrame = (this.currentFrame + 1) % this.images.length;
        this._updateImage();
      }, 60);
    } else { clearInterval(this.autoRotateTimer); this.autoRotateTimer = null; }
    return this.autoRotate;
  }
  dispose() {
    if (this.autoRotateTimer) clearInterval(this.autoRotateTimer);
    if (this.autoPreviewTimer) clearInterval(this.autoPreviewTimer);
    if (this.momentumRAF) cancelAnimationFrame(this.momentumRAF);
    document.removeEventListener('mousemove', this._onMove);
    document.removeEventListener('touchmove', this._onMove);
    document.removeEventListener('mouseup', this._onUp);
    document.removeEventListener('touchend', this._onUp);
    if (this.el) this.el.remove();
    this.el = null; this.imgEl = null; this.progressEl = null;
  }
}

async function openViewer() {
  if (!state.currentProduct) return;
  const overlay = document.getElementById('viewer-overlay');
  const titleEl = document.getElementById('viewer-title');
  const loading = document.getElementById('viewer-loading');
  const rotateBtn = document.getElementById('viewer-rotate-btn');
  overlay.classList.add('active'); titleEl.textContent = state.currentProduct.name;
  if (loading) { loading.style.display = ''; loading.style.opacity = '1'; loading.innerHTML = '<div class="loading-ring"></div><p>Loading...</p>'; }
  if (rotateBtn) rotateBtn.classList.remove('active');
  await new Promise(r => setTimeout(r, 300));
  try {
    const container = document.getElementById('viewer-container');
    if (state.viewer) { state.viewer.dispose(); state.viewer = null; }
    // 如果有360度图片，使用360查看器
    if (state.currentProduct.images360 && state.currentProduct.images360.length > 0) {
      state.viewer = new Viewer360(container, state.currentProduct.images360);
      state.viewer.init();
      document.getElementById('viewer-hint-3d').style.display = 'none';
      document.getElementById('viewer-hint-360').style.display = '';
    } else {
      // 否则使用3D模型查看器
      if (loading) { loading.innerHTML = '<div class="loading-ring"></div><p>Loading 3D model...</p>'; }
      state.viewer = new Viewer3D(container, state.currentProduct.modelType);
      state.viewer.init();
      document.getElementById('viewer-hint-3d').style.display = '';
      document.getElementById('viewer-hint-360').style.display = 'none';
    }
  } catch (err) {
    console.error('Viewer load failed:', err);
    if (loading) { loading.innerHTML = '<div style="font-size:13px;color:#999;text-align:center;padding:20px;"><p style="margin-bottom:8px;">Load failed</p><p style="font-size:12px;">Please check network and retry</p></div>'; }
  }
}

function closeViewer() {
  document.getElementById('viewer-overlay').classList.remove('active');
  setTimeout(() => { if (state.viewer) { state.viewer.dispose(); state.viewer = null; } }, 300);
}

function toggleAutoRotate() {
  if (!state.viewer) return;
  const isOn = state.viewer.toggleAutoRotate();
  const btn = document.getElementById('viewer-rotate-btn');
  if (btn) { btn.classList.toggle('active', isOn); const span = btn.querySelector('span'); if (span) span.textContent = isOn ? 'Stop' : 'Auto Rotate'; }
}

document.getElementById('enter-btn')?.addEventListener('click', enterApp);
document.getElementById('detail-back')?.addEventListener('click', () => showView('list-view'));
document.getElementById('view-3d-btn')?.addEventListener('click', openViewer);
